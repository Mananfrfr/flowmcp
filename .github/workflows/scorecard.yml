name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 6am
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Scorecard
        run: |
          curl -sSL https://github.com/ossf/scorecard/releases/latest/download/scorecard_linux_amd64.tar.gz \
            | tar -xz scorecard_linux_amd64
          chmod +x scorecard_linux_amd64

      - name: Run Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scorecard_linux_amd64 \
            --repo=github.com/SreejaPasula/flowmcp \
            --format=json \
            --show-details \
            2>&1 | tee scorecard-results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard-results.json
